<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><title>Master Customer - BMS Gudang</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="style.css"></head><body><div class="topbar"><h1>Master Customer</h1><div class="userbar" id="userbar"></div></div><div class="wrap"><a href="menu.html" class="btn secondary" style="margin-bottom:12px;">&laquo; Kembali ke Menu</a><div class="card"><div id="msg" class="msg" style="display:none;"></div><label>Cari Customer</label><input id="customerSearch" type="search" placeholder="🔎 Ketik nama/kode/alamat customer..." style="margin-bottom:8px"><label>Customer</label><select id="customerId"><option value="">-- Pilih customer --</option></select><div id="customerInfo" class="hint"></div></div><div class="card"><h2>Tambah Penerima / PT dan Tujuan</h2><label>Nama Penerima / PT</label><input id="recipientName" type="text" placeholder="Contoh: PT. Pitaco Mitra Perkasa"><label>Alamat Tujuan</label><textarea id="recipientAddress" rows="3" placeholder="Alamat pengiriman"></textarea><label>Telepon (opsional)</label><input id="recipientPhone" type="text"><button class="btn block" id="saveRecipient">Simpan Penerima</button><div id="recipientList" style="margin-top:14px;"></div></div><div class="card"><h2>Tambah Harga Barang Customer</h2><label>Jenis Barang / Stok</label><select id="stockId"><option value="">-- Pilih stok --</option></select><label>Jenis Armada Tarif</label><select id="vehicleType"><option value="CD">CD / Colt Diesel</option><option value="TRONTON">Tronton</option></select><label>Kode Tujuan / Tarif</label><input id="destinationCode" type="text" placeholder="Contoh: A01"><label>Harga per M3</label><input id="hargaM3" type="number" step="1" value="0"><label>Catatan / Tujuan Tarif (opsional)</label><input id="destination" type="text"><button class="btn block" id="savePrice">Simpan Harga</button><div id="priceList" style="margin-top:14px;"></div></div></div><script src="common.js"></script><script>(function(){var user=requireLogin();if(!user)return;var customers=[],stocks=[];var msg=document.getElementById("msg"),customerSel=document.getElementById("customerId");document.getElementById("userbar").textContent="Login sebagai: "+user.nama+" ("+user.role+")";function current(){for(var i=0;i<customers.length;i++)if(customers[i].id===customerSel.value)return customers[i];return null}function render(){var c=current(),info=document.getElementById("customerInfo"),rl=document.getElementById("recipientList"),pl=document.getElementById("priceList");info.textContent=c?(c.kode+" - "+c.nama+(c.alamat?" | "+c.alamat:"")):"";rl.innerHTML="";pl.innerHTML="";if(!c)return;var rt=document.createElement("table");rt.className="sj-table";rt.innerHTML="<thead><tr><th>PT / Penerima</th><th>Alamat Tujuan</th></tr></thead>";var rb=document.createElement("tbody");for(var i=0;i<(c.recipients||[]).length;i++){var tr=document.createElement("tr"),a=document.createElement("td"),b=document.createElement("td");a.textContent=c.recipients[i].nama;b.textContent=c.recipients[i].alamat;tr.appendChild(a);tr.appendChild(b);rb.appendChild(tr)}rt.appendChild(rb);rl.appendChild(rt);var pt=document.createElement("table");pt.className="sj-table";pt.innerHTML="<thead><tr><th>Barang</th><th>Armada</th><th>Kode</th><th>Harga/M3</th></tr></thead>";var pb=document.createElement("tbody");for(var j=0;j<(c.prices||[]).length;j++){var p=c.prices[j],tr2=document.createElement("tr"),vals=[p.stockCode+" - "+p.stockName,p.vehicleType,p.destinationCode,rupiah(p.hargaM3)];for(var k=0;k<vals.length;k++){var td=document.createElement("td");td.textContent=vals[k];tr2.appendChild(td)}pb.appendChild(tr2)}pt.appendChild(pb);pl.appendChild(pt)}function reload(){return api.get("/customers").then(function(d){customers=d;renderCustomerOptions();render()})}
function renderCustomerOptions(){var q=(document.getElementById("customerSearch").value||"").trim().toLowerCase(),selected=customerSel.value;customerSel.innerHTML='<option value="">-- Pilih customer --</option>';for(var i=0;i<customers.length;i++){var c=customers[i],hay=(c.kode+" "+c.nama+" "+(c.alamat||"")).toLowerCase();if(!q||hay.indexOf(q)!==-1){var o=document.createElement("option");o.value=c.id;o.textContent=c.nama;customerSel.appendChild(o)}}customerSel.value=selected;if(customerSel.value!==selected)render()}
document.getElementById("customerSearch").addEventListener("input",renderCustomerOptions);customerSel.addEventListener("change",render);Promise.all([reload(),api.get("/stock-master")]).then(function(r){stocks=r[1];var s=document.getElementById("stockId");for(var i=0;i<stocks.length;i++){var o=document.createElement("option");o.value=stocks[i].id;o.setAttribute("data-kode",stocks[i].kode);o.setAttribute("data-nama",stocks[i].nama);o.textContent=stocks[i].kode+" - "+stocks[i].nama;s.appendChild(o)}}).catch(function(e){showMsg(msg,e.message||"Gagal memuat master","err")});document.getElementById("saveRecipient").addEventListener("click",function(){var c=current(),nama=document.getElementById("recipientName").value.trim(),alamat=document.getElementById("recipientAddress").value.trim();if(!c||!nama||!alamat){showMsg(msg,"Pilih customer serta isi nama penerima dan alamat","err");return}api.post("/customers/"+c.id+"/recipients",{nama:nama,alamat:alamat,telepon:document.getElementById("recipientPhone").value.trim()||null}).then(function(){showMsg(msg,"Penerima dan tujuan tersimpan","ok");document.getElementById("recipientName").value="";document.getElementById("recipientAddress").value="";document.getElementById("recipientPhone").value="";reload()}).catch(function(e){showMsg(msg,e.message||"Gagal menyimpan penerima","err")})});document.getElementById("savePrice").addEventListener("click",function(){var c=current(),s=document.getElementById("stockId"),o=s.options[s.selectedIndex],kode=document.getElementById("destinationCode").value.trim();if(!c||!s.value||!kode){showMsg(msg,"Pilih customer, stok dan isi kode tujuan/tarif","err");return}api.post("/customers/"+c.id+"/prices",{destinationCode:kode,stockCode:o.getAttribute("data-kode"),stockName:o.getAttribute("data-nama"),vehicleType:document.getElementById("vehicleType").value,hargaM3:Number(document.getElementById("hargaM3").value||0),destination:document.getElementById("destination").value.trim()||null}).then(function(){showMsg(msg,"Harga customer tersimpan","ok");reload()}).catch(function(e){showMsg(msg,e.message||"Gagal menyimpan harga","err")})});})();</script></body></html>
