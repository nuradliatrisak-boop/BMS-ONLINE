<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard BMS Gudang</title><link rel="stylesheet" href="style.css"></head><body><div class="topbar"><h1>Dashboard BMS Gudang</h1><div id="userbar" class="userbar"></div></div><div class="wrap"><a href="menu.html" class="btn secondary">&laquo; Menu</a><div class="card"><h2>Ringkasan</h2><div id="stats" class="loading">Memuat...</div></div><div class="card"><h2>Surat Jalan Terbaru</h2><div id="recent" class="loading"></div></div></div><script src="common.js"></script><script>(function(){var u=requireLogin();if(!u)return;document.getElementById('userbar').textContent='Login sebagai: '+u.nama+' ('+u.role+')';api.get('/surat-jalan').then(function(sj){api.get('/invoices').then(function(inv){var draft=0,final=0;for(var i=0;i<sj.length;i++)sj[i].isDraft?draft++:final++;document.getElementById('stats').innerHTML='<p><b>Draft Surat Jalan:</b> '+draft+'</p><p><b>Surat Jalan final:</b> '+final+'</p><p><b>Total Invoice:</b> '+inv.length+'</p><p><a class="btn" href="surat-jalan-list.html">Daftar Surat Jalan</a> <a class="btn" href="invoice-list.html">Daftar Invoice</a></p>';var html='<table class="sj-table"><tr><th>No</th><th>Status</th><th>Customer</th><th>Barang</th><th>M3</th></tr>';for(var j=0;j<Math.min(10,sj.length);j++){var x=sj[j];html+='<tr><td>'+x.no+'</td><td>'+(x.isDraft?'DRAFT':'FINAL')+'</td><td>'+((x.customer&&x.customer.nama)||'-')+'</td><td>'+(x.jenisBarang||'-')+'</td><td>'+Number(x.m3||0).toFixed(3)+'</td></tr>'}html+='</table>';document.getElementById('recent').innerHTML=html}).catch(function(e){document.getElementById('stats').textContent=e.message})}).catch(function(e){document.getElementById('stats').textContent=e.message})})();</script></body></html>
