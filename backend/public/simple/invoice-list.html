<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftar Invoice</title><link rel="stylesheet" href="style.css"></head><body><div class="topbar"><h1>Daftar Invoice</h1><div id="userbar" class="userbar"></div></div><div class="wrap"><a href="dashboard.html" class="btn secondary">&laquo; Dashboard</a> <a href="invoice.html" class="btn">+ Buat Invoice</a><div class="card"><div id="msg" class="msg" style="display:none"></div><div id="list" class="loading">Memuat...</div></div></div><script src="common.js"></script><script src="print.js"></script><script>(function(){var u=requireLogin();if(!u)return;document.getElementById('userbar').textContent='Login sebagai: '+u.nama;var box=document.getElementById('list'),msg=document.getElementById('msg');function load(){api.get('/invoices').then(function(a){var h='<table class="sj-table"><tr><th>No Invoice</th><th>Customer</th><th>Total</th><th>Status</th><th>Aksi</th></tr>';for(var i=0;i<a.length;i++){var x=a[i];h+='<tr><td>'+x.no+'</td><td>'+((x.customer&&x.customer.nama)||'-')+'</td><td>'+rupiah(x.total||0)+'</td><td>'+x.status+'</td><td><button class="btn secondary print" data-id="'+x.id+'">Print</button> <button class="btn danger del" data-id="'+x.id+'">Hapus</button></td></tr>'}h+='</table>';box.innerHTML=h;var ps=box.getElementsByClassName('print');for(var j=0;j<ps.length;j++)ps[j].onclick=function(){api.get('/invoices/'+this.getAttribute('data-id')).then(printInvoice)};var ds=box.getElementsByClassName('del');for(var k=0;k<ds.length;k++)ds[k].onclick=function(){var id=this.getAttribute('data-id');if(!confirm('Hapus Invoice ini?'))return;api.del('/invoices/'+id).then(load).catch(function(e){showMsg(msg,e.message,'err')})}}).catch(function(e){box.textContent=e.message})}load()})();</script></body></html>
