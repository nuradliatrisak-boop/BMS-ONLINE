<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><title>Buat Invoice - BMS Gudang</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="style.css"></head><body><div class="topbar"><h1>Buat Invoice</h1><div class="userbar" id="userbar"></div></div><div class="wrap"><a href="menu.html" class="btn secondary" style="margin-bottom:12px;">&laquo; Kembali ke Menu</a><div class="card"><div id="msg" class="msg" style="display:none;"></div><form id="invHeaderForm"><label>Divisi</label><select id="divisi"></select><label>Customer</label><select id="customerId"><option value="">-- Pilih Customer --</option></select><table class="row2"><tr><td><label>Tanggal Invoice</label><input type="date" id="tanggal"></td><td><label>Jatuh Tempo</label><input type="date" id="jatuhTempo"></td></tr></table><label>Catatan</label><textarea id="catatan" rows="2"></textarea></form></div><div class="card"><h2>Surat Jalan Belum Ditagih</h2><div id="sjLoading" class="loading">Pilih customer dulu.</div><div id="sjTableWrap" style="display:none;overflow-x:auto;"><table class="sj-table"><thead><tr><th></th><th>No. SJ</th><th>Tanggal</th><th>PT / Tujuan / Barang</th><th>Armada Tarif</th><th>M3</th><th>Harga (Rp)</th></tr></thead><tbody id="sjTbody"></tbody></table></div><div class="total-box" id="totalBox">Total: Rp 0</div></div><button type="button" class="btn block" id="btnSubmit">Simpan Invoice</button><div id="printBox" style="display:none;margin-top:12px;"><button type="button" class="btn secondary block" id="btnPrint">Cetak Invoice</button></div></div><script src="common.js"></script><script src="print.js"></script><script>
(function(){var user=requireLogin();if(!user)return;var DIVISI=["Supplier","Armada","Alat Berat","Kontraktor","Kapal"],customers=[],rows=[],lastSavedInv=null;var msg=document.getElementById("msg"),divisiSel=document.getElementById("divisi"),customerSel=document.getElementById("customerId"),sjLoading=document.getElementById("sjLoading"),sjTableWrap=document.getElementById("sjTableWrap"),sjTbody=document.getElementById("sjTbody"),totalBox=document.getElementById("totalBox"),btn=document.getElementById("btnSubmit"),printBox=document.getElementById("printBox"),btnPrint=document.getElementById("btnPrint");document.getElementById("userbar").textContent="Login sebagai: "+user.nama+" ("+user.role+")";for(var i=0;i<DIVISI.length;i++){var o=document.createElement("option");o.value=DIVISI[i];o.textContent=DIVISI[i];divisiSel.appendChild(o)}if(user.divisi&&DIVISI.indexOf(user.divisi)!==-1)divisiSel.value=user.divisi;document.getElementById("tanggal").value=todayStr();
function fmtTgl(v){if(!v)return"-";var d=new Date(v);return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear()}function norm(v){return String(v||"").trim().toUpperCase()}
function getCustomer(){for(var i=0;i<customers.length;i++)if(customers[i].id===customerSel.value)return customers[i];return null}function stockCode(sj){return sj.detail&&sj.detail.stockCode?sj.detail.stockCode:""}function vehicleOf(sj){var v=sj.detail&&sj.detail.vehicleType;if(v)return norm(v);var j=norm(sj.armada&&sj.armada.jenis);return j.indexOf("TRONTON")!==-1?"TRONTON":"CD"}function suggestedPrice(sj,vehicle){var c=getCustomer(),prices=(c&&c.prices)||[],code=stockCode(sj),name=norm(sj.jenisBarang);for(var i=0;i<prices.length;i++)if(norm(prices[i].vehicleType||"CD")===vehicle&&(code?norm(prices[i].stockCode)===norm(code):norm(prices[i].stockName)===name))return Number(prices[i].hargaM3||0);return 0}
function renderRows(){sjTbody.innerHTML="";var total=0;for(var i=0;i<rows.length;i++)(function(idx){var r=rows[idx],sj=r.sj,tr=document.createElement("tr"),td=document.createElement("td"),cb=document.createElement("input");cb.type="checkbox";cb.checked=r.checked;cb.addEventListener("change",function(){r.checked=cb.checked;updateTotal()});td.appendChild(cb);tr.appendChild(td);var vals=[sj.no,fmtTgl(sj.tanggal),(sj.penerima||"-")+" / "+(sj.tujuan||"-")+" / "+(sj.jenisBarang||"-" )];for(var x=0;x<vals.length;x++){var t=document.createElement("td");t.textContent=vals[x];tr.appendChild(t)}var tdV=document.createElement("td"),vs=document.createElement("select");vs.innerHTML='<option value="CD">CD / Colt Diesel</option><option value="TRONTON">Tronton</option>';vs.value=r.vehicleType;vs.addEventListener("change",function(){r.vehicleType=vs.value;r.hargaSatuan=suggestedPrice(sj,r.vehicleType);renderRows()});tdV.appendChild(vs);tr.appendChild(tdV);var tdM=document.createElement("td");tdM.textContent=sj.m3;tr.appendChild(tdM);var tdH=document.createElement("td"),inp=document.createElement("input");inp.type="number";inp.step="1";inp.value=r.hargaSatuan;inp.style.width="110px";inp.addEventListener("input",function(){r.hargaSatuan=Number(inp.value||0);updateTotal()});tdH.appendChild(inp);tr.appendChild(tdH);sjTbody.appendChild(tr);if(r.checked)total+=Number(r.hargaSatuan||0)*Number(sj.m3||0)})(i);totalBox.textContent="Total: "+rupiah(total)}function updateTotal(){var t=0;for(var i=0;i<rows.length;i++)if(rows[i].checked)t+=Number(rows[i].hargaSatuan||0)*Number(rows[i].sj.m3||0);totalBox.textContent="Total: "+rupiah(t)}
function loadBelumDitagih(){rows=[];sjTbody.innerHTML="";sjTableWrap.style.display="none";if(!customerSel.value){sjLoading.style.display="block";sjLoading.textContent="Pilih customer dulu.";updateTotal();return}sjLoading.style.display="block";sjLoading.textContent="Memuat surat jalan...";api.get("/surat-jalan/belum-ditagih?customerId="+encodeURIComponent(customerSel.value)).then(function(list){for(var i=0;i<list.length;i++){var v=vehicleOf(list[i]);rows.push({sj:list[i],checked:true,vehicleType:v,hargaSatuan:suggestedPrice(list[i],v)})}sjLoading.style.display=rows.length?"none":"block";if(!rows.length){sjLoading.textContent="Tidak ada surat jalan yang belum ditagih.";updateTotal();return}sjTableWrap.style.display="block";renderRows()}).catch(function(e){sjLoading.style.display="block";sjLoading.textContent="Gagal memuat surat jalan: "+(e.message||"")})}customerSel.addEventListener("change",loadBelumDitagih);
api.get("/customers").then(function(data){customers=data;for(var i=0;i<customers.length;i++){var o=document.createElement("option");o.value=customers[i].id;o.textContent=customers[i].nama;customerSel.appendChild(o)}}).catch(function(e){showMsg(msg,e.message||"Gagal memuat customer","err")});btnPrint.addEventListener("click",function(){if(!lastSavedInv)return;btnPrint.disabled=true;printInvoice(lastSavedInv).then(function(){btnPrint.disabled=false}).catch(function(e){btnPrint.disabled=false;showMsg(msg,"Gagal menyiapkan cetakan: "+(e.message||""),"err")})});
btn.addEventListener("click",function(){hideMsg(msg);var items=[];for(var i=0;i<rows.length;i++)if(rows[i].checked)items.push({suratJalanId:rows[i].sj.id,hargaSatuan:Number(rows[i].hargaSatuan||0)});if(!divisiSel.value||!customerSel.value||!document.getElementById("tanggal").value||!items.length){showMsg(msg,"Divisi, customer, tanggal dan minimal 1 surat jalan wajib diisi","err");return}btn.disabled=true;btn.textContent="Menyimpan...";api.post("/invoices",{divisi:divisiSel.value,customerId:customerSel.value,tanggal:document.getElementById("tanggal").value,jatuhTempo:document.getElementById("jatuhTempo").value||null,catatan:document.getElementById("catatan").value.trim(),halaman:1,items:items}).then(function(d){showMsg(msg,"Invoice tersimpan: "+d.no+" (Total "+rupiah(d.total)+")","ok");lastSavedInv=d;btnPrint.textContent="Cetak Invoice ("+d.no+")";printBox.style.display="block"}).catch(function(e){showMsg(msg,e.message||"Gagal menyimpan invoice","err")}).then(function(){btn.disabled=false;btn.textContent="Simpan Invoice"})});})();
</script></body></html>
