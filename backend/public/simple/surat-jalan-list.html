<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftar Surat Jalan</title><link rel="stylesheet" href="style.css"></head><body><div class="topbar"><h1>Daftar Surat Jalan</h1><div id="userbar" class="userbar"></div></div><div class="wrap"><a href="dashboard.html" class="btn secondary">&laquo; Dashboard</a> <a href="surat-jalan.html" class="btn">+ Buat Surat Jalan</a><div class="card"><div id="msg" class="msg" style="display:none"></div><div id="list" class="loading">Memuat...</div></div></div><script src="common.js"></script><script src="print.js"></script><script>(function(){var u=requireLogin();if(!u)return;document.getElementById('userbar').textContent='Login sebagai: '+u.nama;var box=document.getElementById('list'),msg=document.getElementById('msg');function fdate(v){var d=new Date(v);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()}function load(){api.get('/surat-jalan').then(function(a){var h='<table class="sj-table"><tr><th>No SJ</th><th>Tanggal</th><th>Customer</th><th>Barang</th><th>M3</th><th>Status</th><th>Aksi</th></tr>';for(var i=0;i<a.length;i++){var x=a[i];h+='<tr><td>'+x.no+'</td><td>'+fdate(x.tanggal)+'</td><td>'+((x.customer&&x.customer.nama)||'-')+'</td><td>'+(x.jenisBarang||'-')+'</td><td>'+Number(x.m3||0).toFixed(3)+'</td><td>'+(x.isDraft?'DRAFT':'FINAL')+'</td><td><button class="btn edit" data-id="'+x.id+'">Edit</button> <button class="btn secondary print" data-id="'+x.id+'">Print</button> <button class="btn danger del" data-id="'+x.id+'">Hapus</button></td></tr>'}h+='</table>';box.innerHTML=h;var bs=box.getElementsByClassName('edit');for(var j=0;j<bs.length;j++)bs[j].onclick=function(){location.href='surat-jalan.html?id='+encodeURIComponent(this.getAttribute('data-id'))};var ps=box.getElementsByClassName('print');for(var k=0;k<ps.length;k++)ps[k].onclick=function(){var id=this.getAttribute('data-id');api.get('/surat-jalan/'+id).then(printSJ)};var ds=box.getElementsByClassName('del');for(var l=0;l<ds.length;l++)ds[l].onclick=function(){var id=this.getAttribute('data-id');if(!confirm('Hapus Surat Jalan ini?'))return;api.del('/surat-jalan/'+id).then(load).catch(function(e){showMsg(msg,e.message,'err')})}}).catch(function(e){box.textContent=e.message})}load()})();</script></body></html>
