<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><title>Input Surat Jalan - BMS Gudang</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="style.css"></head><body>
<div class="topbar"><h1>Input Surat Jalan</h1><div class="userbar" id="userbar"></div></div><div class="wrap"><a href="menu.html" class="btn secondary" style="margin-bottom:12px;">&laquo; Kembali ke Menu</a><div class="card"><div id="msg" class="msg" style="display:none;"></div>
<form id="sjForm">
<label>Divisi</label><select id="divisi"></select>
<label>Customer</label><select id="customerId"><option value="">-- Pilih Customer --</option></select>
<label>Penerima / PT</label><select id="penerimaId"><option value="">-- Pilih penerima / PT --</option></select>
<label>Tujuan / Alamat</label><select id="tujuanId"><option value="">-- Pilih alamat tujuan --</option></select>
<div class="hint">Pilih Customer, lalu PT/Penerima, kemudian alamat tujuan. Jika customer tidak punya data penerima, nama dan alamat customer dipakai otomatis.</div>
<label>Jenis Barang / Stok</label><select id="stockId"><option value="">-- Pilih jenis barang --</option></select>
<label>Jenis Tarif Armada</label><select id="vehicleType"><option value="CD">CD / Colt Diesel</option><option value="TRONTON">Tronton</option></select>
<label>Armada (opsional)</label><select id="armadaId"><option value="">-- Pilih Armada (opsional) --</option></select>
<table class="row2"><tr><td><label>Tanggal</label><input type="date" id="tanggal"></td><td><label>Jam</label><input type="time" id="jam"></td></tr></table>
<table class="row2"><tr><td><label>No. Polisi</label><input type="text" id="noPolisi"></td><td><label>Sopir</label><input type="text" id="sopir"></td></tr></table>
<label>Ukuran Muatan (P x L x T)</label><table class="row2"><tr><td><input type="number" step="0.001" id="panjang" placeholder="Panjang"></td><td><input type="number" step="0.001" id="lebar" placeholder="Lebar"></td><td><input type="number" step="0.001" id="tinggi" placeholder="Tinggi"></td></tr></table><div class="hint" id="m3Preview">M3: 0</div>
<button type="submit" class="btn block" id="btnSubmit">Simpan Surat Jalan</button></form><div id="printBox" style="display:none;margin-top:12px;"><button type="button" class="btn secondary block" id="btnPrint">Cetak Surat Jalan</button></div></div></div>
<script src="common.js"></script><script src="print.js"></script><script>
(function(){var user=requireLogin();if(!user)return;var DIVISI=["Supplier","Armada","Alat Berat","Kontraktor","Kapal"],customers=[],armadaList=[],stocks=[],lastSavedSJ=null;var msg=document.getElementById("msg"),divisiSel=document.getElementById("divisi"),customerSel=document.getElementById("customerId"),penerimaSel=document.getElementById("penerimaId"),tujuanSel=document.getElementById("tujuanId"),stockSel=document.getElementById("stockId"),vehicleSel=document.getElementById("vehicleType"),armadaSel=document.getElementById("armadaId"),btn=document.getElementById("btnSubmit"),printBox=document.getElementById("printBox"),btnPrint=document.getElementById("btnPrint");document.getElementById("userbar").textContent="Login sebagai: "+user.nama+" ("+user.role+")";
for(var i=0;i<DIVISI.length;i++){var o=document.createElement("option");o.value=DIVISI[i];o.textContent=DIVISI[i];divisiSel.appendChild(o)}if(user.divisi&&DIVISI.indexOf(user.divisi)!==-1)divisiSel.value=user.divisi;document.getElementById("tanggal").value=todayStr();document.getElementById("jam").value=nowTimeStr();
function findCustomer(id){for(var i=0;i<customers.length;i++)if(customers[i].id===id)return customers[i];return null}function clearSelect(s,text){s.innerHTML='<option value="">'+text+'</option>'}function recipientsOf(c){return(c&&c.recipients)||[]}
function uniqueRecipients(c){var all=recipientsOf(c),out=[],seen={};for(var i=0;i<all.length;i++){var k=(all[i].nama||"").toUpperCase();if(k&&!seen[k]){seen[k]=1;out.push(all[i].nama)}}return out}
function onCustomerChange(){clearSelect(penerimaSel,"-- Pilih penerima / PT --");clearSelect(tujuanSel,"-- Pilih alamat tujuan --");var c=findCustomer(customerSel.value),names=uniqueRecipients(c);if(names.length){for(var i=0;i<names.length;i++){var o=document.createElement("option");o.value=names[i];o.textContent=names[i];penerimaSel.appendChild(o)}}else if(c){var o2=document.createElement("option");o2.value=c.nama;o2.textContent=c.nama;penerimaSel.appendChild(o2);penerimaSel.value=c.nama;onPenerimaChange()}}
function onPenerimaChange(){clearSelect(tujuanSel,"-- Pilih alamat tujuan --");var c=findCustomer(customerSel.value),nama=penerimaSel.value,all=recipientsOf(c),count=0;for(var i=0;i<all.length;i++)if(all[i].nama===nama){var o=document.createElement("option");o.value=all[i].alamat;o.textContent=all[i].alamat;tujuanSel.appendChild(o);count++}if(!count&&c&&nama===c.nama&&c.alamat){var o2=document.createElement("option");o2.value=c.alamat;o2.textContent=c.alamat;tujuanSel.appendChild(o2)}if(tujuanSel.options.length===2)tujuanSel.selectedIndex=1}
function updateM3(){var p=Number(document.getElementById("panjang").value||0),l=Number(document.getElementById("lebar").value||0),t=Number(document.getElementById("tinggi").value||0);document.getElementById("m3Preview").textContent="M3: "+Math.round(p*l*t*1000)/1000}customerSel.addEventListener("change",onCustomerChange);penerimaSel.addEventListener("change",onPenerimaChange);document.getElementById("panjang").addEventListener("input",updateM3);document.getElementById("lebar").addEventListener("input",updateM3);document.getElementById("tinggi").addEventListener("input",updateM3);
armadaSel.addEventListener("change",function(){for(var i=0;i<armadaList.length;i++)if(armadaList[i].id===armadaSel.value){var a=armadaList[i];if(!document.getElementById("noPolisi").value)document.getElementById("noPolisi").value=a.nopol;if(!document.getElementById("sopir").value&&a.sopir)document.getElementById("sopir").value=a.sopir;var j=String(a.jenis||"").toUpperCase();if(j.indexOf("TRONTON")!==-1)vehicleSel.value="TRONTON";else if(j.indexOf("CD")!==-1||j.indexOf("COLT")!==-1||j.indexOf("DIESEL")!==-1)vehicleSel.value="CD";break}});
function loadMaster(){return Promise.all([api.get("/customers"),api.get("/armada"),api.get("/stock-master")]).then(function(r){customers=r[0];armadaList=r[1];stocks=r[2];for(var i=0;i<customers.length;i++){var o=document.createElement("option");o.value=customers[i].id;o.textContent=customers[i].nama;customerSel.appendChild(o)}for(var j=0;j<armadaList.length;j++){var a=document.createElement("option");a.value=armadaList[j].id;a.textContent=armadaList[j].nopol+(armadaList[j].jenis?" - "+armadaList[j].jenis:"");armadaSel.appendChild(a)}for(var k=0;k<stocks.length;k++){var s=document.createElement("option");s.value=stocks[k].id;s.setAttribute("data-kode",stocks[k].kode);s.setAttribute("data-nama",stocks[k].nama);s.textContent=stocks[k].kode+" - "+stocks[k].nama;stockSel.appendChild(s)}}).catch(function(e){showMsg(msg,e.message||"Gagal memuat master", "err")})}loadMaster();
btnPrint.addEventListener("click",function(){if(!lastSavedSJ)return;btnPrint.disabled=true;printSJ(lastSavedSJ).then(function(){btnPrint.disabled=false}).catch(function(e){btnPrint.disabled=false;showMsg(msg,"Gagal menyiapkan cetakan: "+(e.message||""),"err")})});
document.getElementById("sjForm").addEventListener("submit",function(e){e.preventDefault();hideMsg(msg);var so=stockSel.options[stockSel.selectedIndex],payload={divisi:divisiSel.value,customerId:customerSel.value||null,armadaId:armadaSel.value||null,penerima:penerimaSel.value||null,tujuan:tujuanSel.value||"",jenisBarang:so&&so.value?so.getAttribute("data-nama"):"",noPolisi:document.getElementById("noPolisi").value.trim(),sopir:document.getElementById("sopir").value.trim(),panjang:Number(document.getElementById("panjang").value||0),lebar:Number(document.getElementById("lebar").value||0),tinggi:Number(document.getElementById("tinggi").value||0),tanggal:document.getElementById("tanggal").value,jam:document.getElementById("jam").value,isDraft:false,detail:{stockId:stockSel.value,stockCode:so&&so.value?so.getAttribute("data-kode"):"",stockName:so&&so.value?so.getAttribute("data-nama"):"",vehicleType:vehicleSel.value}};if(!payload.divisi||!payload.customerId||!payload.penerima||!payload.tujuan||!stockSel.value||!payload.tanggal){showMsg(msg,"Customer, penerima/PT, tujuan, jenis barang, divisi dan tanggal wajib dipilih", "err");return}btn.disabled=true;btn.textContent="Menyimpan...";api.post("/surat-jalan",payload).then(function(d){showMsg(msg,"Surat Jalan tersimpan: "+d.no,"ok");lastSavedSJ=d;btnPrint.textContent="Cetak Surat Jalan ("+d.no+")";printBox.style.display="block";document.getElementById("sjForm").reset();document.getElementById("tanggal").value=todayStr();document.getElementById("jam").value=nowTimeStr();clearSelect(penerimaSel,"-- Pilih penerima / PT --");clearSelect(tujuanSel,"-- Pilih alamat tujuan --");document.getElementById("m3Preview").textContent="M3: 0";if(user.divisi&&DIVISI.indexOf(user.divisi)!==-1)divisiSel.value=user.divisi}).catch(function(er){showMsg(msg,er.message||"Gagal menyimpan surat jalan","err")}).then(function(){btn.disabled=false;btn.textContent="Simpan Surat Jalan"})});})();
</script></body></html>
